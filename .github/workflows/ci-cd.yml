name: CI/CD

# Todo cambio en main/develop (o PR hacia ellas) recorre las mismas etapas.
# El despliegue solo ocurre en push y únicamente si TODAS las puertas de
# calidad y seguridad anteriores pasan.
on:
  push:
    branches: [main, develop, ep2]
  pull_request:
    branches: [main, develop, ep2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: cada job pide solo lo que necesita
permissions:
  contents: read

env:
  IMAGE_LOCAL: order-manager:ci

jobs:
  # ============================================================
  # 1. Pruebas unitarias + cobertura (puerta de calidad)
  # ============================================================
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # `verify` ejecuta las pruebas, genera el reporte JaCoCo y falla si la
      # cobertura de líneas baja del 70 % (regla definida en el pom.xml).
      - name: Ejecutar pruebas y verificar cobertura
        run: mvn -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1{m+=$8;c+=$9} END{printf "### Cobertura de líneas (JaCoCo)\n\n**%.1f %%** (mínimo exigido: 70 %%)\n", 100*c/(m+c)}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports
            target/site/jacoco
          retention-days: 14

  # ============================================================
  # 2. Análisis estático de código (SonarQube) con Quality Gate
  #    SonarQube Community corre como contenedor de servicio dentro
  #    del propio job: no requiere cuentas, tokens ni secretos.
  # ============================================================
  sonar:
    name: Análisis SonarQube
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:26.10.0.133078-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Espera a que el servidor arranque, cambia la clave de admin por una
      # aleatoria y genera un token efímero para el análisis.
      - name: Preparar SonarQube
        run: |
          for _ in $(seq 1 60); do
            STATUS="$(curl -s http://localhost:9000/api/system/status | jq -r .status 2>/dev/null || true)"
            [ "$STATUS" = "UP" ] && break
            sleep 5
          done
          test "$STATUS" = "UP"

          PASS="Ci-$(openssl rand -hex 8)-Aa1"
          echo "::add-mask::$PASS"
          curl -fsS -u admin:admin -X POST http://localhost:9000/api/users/change_password \
            -d login=admin -d previousPassword=admin --data-urlencode password="$PASS"
          TOKEN="$(curl -fsS -u "admin:$PASS" -X POST http://localhost:9000/api/user_tokens/generate -d name=ci | jq -r .token)"
          echo "::add-mask::$TOKEN"
          {
            echo "SONAR_ADMIN_PASSWORD=$PASS"
            echo "SONAR_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

      # qualitygate.wait=true: el paso FALLA (y bloquea el despliegue) si el
      # Quality Gate no se cumple.
      - name: Analizar con SonarQube
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.projectKey=order-manager \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Resumen de calidad
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Análisis estático (SonarQube)"
            echo ""
            echo "| Métrica | Valor |"
            echo "|---|---|"
            curl -fsS -u "admin:$SONAR_ADMIN_PASSWORD" \
              "http://localhost:9000/api/measures/component?component=order-manager&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density" \
              | jq -r '.component.measures[] | "| \(.metric) | \(.value) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alerta de Quality Gate
        if: failure()
        run: |
          echo "### ❌ SonarQube: el Quality Gate falló. El despliegue queda bloqueado." >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 3. Construcción de la imagen + escaneo de vulnerabilidades
  # ============================================================
  build-scan:
    name: Imagen Docker y Trivy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # El Dockerfile multi-stage vuelve a ejecutar las pruebas (etapa "test");
      # si fallan, no se genera imagen.
      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          tags: ${{ env.IMAGE_LOCAL }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Puerta de seguridad: falla ante vulnerabilidades HIGH/CRITICAL con
      # parche disponible. Las excepciones aceptadas están en .trivyignore.
      # La Action se fija por SHA de commit (v0.36.0) por el incidente de
      # cadena de suministro de marzo de 2026 en esta Action.
      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCAL }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table

      - name: Alerta de seguridad
        if: failure()
        run: |
          echo "### ❌ Trivy encontró vulnerabilidades HIGH/CRITICAL. El despliegue queda bloqueado." >> "$GITHUB_STEP_SUMMARY"

      # La MISMA imagen que se escaneó es la que se despliega y publica
      - name: Guardar imagen como artefacto
        run: docker save "$IMAGE_LOCAL" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: imagen-docker
          path: image.tar.gz
          compression-level: 0
          retention-days: 1

  # ============================================================
  # 4. Despliegue automático en un entorno simulado (Docker Compose
  #    sobre el runner) + pruebas de humo
  #    develop -> staging | main y ep2 -> production
  # ============================================================
  deploy:
    name: Despliegue (${{ (github.ref_name == 'main' || github.ref_name == 'ep2') && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    needs: [sonar, build-scan]
    if: github.event_name == 'push'
    environment: ${{ (github.ref_name == 'main' || github.ref_name == 'ep2') && 'production' || 'staging' }}
    env:
      APP_IMAGE: order-manager:ci
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: imagen-docker

      - name: Cargar imagen escaneada
        run: docker load -i image.tar.gz

      # La contraseña de la base es efímera: se genera en cada despliegue
      - name: Generar credenciales del entorno
        run: |
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          echo "DB_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Desplegar con Docker Compose
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Pruebas de humo
        run: |
          B=http://localhost:8098

          echo "1) Salud"
          curl -fsS "$B/actuator/health" | jq -e '.status == "UP"'

          echo "2) Trazabilidad: el commit desplegado es el del pipeline"
          DEPLOYED="$(curl -fsS "$B/actuator/info" | jq -r '.app.commit')"
          echo "desplegado=$DEPLOYED esperado=$GITHUB_SHA"
          test "$DEPLOYED" = "$GITHUB_SHA"

          echo "3) Flujo de negocio contra PostgreSQL"
          ID="$(curl -fsS -X POST "$B/api/orders" -H 'Content-Type: application/json' \
                -d '{"customerName":"Smoke","items":[{"productName":"X","quantity":2,"unitPrice":10.5}]}' | jq -r '.id')"
          curl -fsS -X PUT "$B/api/orders/$ID/confirm" | jq -e '.status == "CONFIRMED"'
          curl -fsS "$B/api/orders/$ID" | jq -e '.totalAmount == 21'

      - name: Resumen del despliegue
        run: |
          {
            echo "### 🚀 Desplegado en ${{ (github.ref_name == 'main' || github.ref_name == 'ep2') && 'production' || 'staging' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Rama | \`${GITHUB_REF_NAME}\` |"
            echo "| Run | #${GITHUB_RUN_NUMBER} |"
            echo "| Imagen | \`$(docker image inspect "$APP_IMAGE" --format '{{.Id}}')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Bajar el entorno
        if: always()
        run: docker compose down -v

  # ============================================================
  # 5. Publicación de la imagen en GitHub Container Registry
  #    (solo desde main/ep2, tras desplegar y pasar las pruebas de humo)
  # ============================================================
  publish:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ep2')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: imagen-docker

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiquetas inmutables por commit + "latest": cada imagen publicada
      # se puede rastrear hasta el commit que la originó.
      - name: Etiquetar y subir
        run: |
          docker load -i image.tar.gz
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$IMAGE_LOCAL" "$IMAGE:${GITHUB_SHA::7}"
          docker tag "$IMAGE_LOCAL" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          echo "### 📦 Publicado: \`$IMAGE:${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
