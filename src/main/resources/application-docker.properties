# ============================================================
# Perfil "docker": PostgreSQL en contenedor (docker-compose.yml)
# Las credenciales llegan por variables de entorno, nunca en el código.
# ============================================================

# Base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:orderdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: el esquema persiste entre reinicios (volumen de PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad: sin consola H2 y sin detalle de salud público
spring.h2.console.enabled=false
management.endpoint.health.show-details=never

# Trazabilidad: /actuator/info informa qué commit está desplegado
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.commit=${GIT_COMMIT:unknown}
