# Configuración de SonarQube para Order Manager.
#
# El pipeline levanta SonarQube Community como contenedor de servicio y
# ejecuta sonar-maven-plugin pasándole estos valores por -D (ver
# .github/workflows/ci-cd.yml); este archivo documenta la misma
# configuración y sirve si se corre el SonarScanner CLI a mano.
sonar.host.url=http://localhost:9000
sonar.projectKey=order-manager
sonar.projectName=order-manager

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.source=17
sonar.sourceEncoding=UTF-8

# Cobertura (la genera JaCoCo en `mvn verify`)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
